name: I7 official figure recovery (one-time, read-only)
on:
  push:
    branches: ["audit/anre-v8-priority-17-20261109"]
    paths: [".github/workflows/i7-official-figure-fetch.yml"]
permissions:
  contents: read
jobs:
  fetch-official:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch public legal figures with provenance; no repo writes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, hashlib, json, pathlib, time
          base='https://legislatie.just.ro/ImaginiDinActe/'
          names="""287132_A33143_dBB-.jpg
          287132_A33149_dBB-.jpg
          287132_A13981_dBB-.jpg
          287132_A13983_dBB-.jpg
          287132_A13985_dBB-.jpg
          287132_A13987_dBB-.jpg
          287132_A13991__dBB-.jpg
          287132_A16866_dBB-.jpg
          287132_A16869__dBB-.jpg
          287132_A16872__dBB-.jpg
          287132_A17104_dBB-.jpg
          287132_A17105__dBB-.jpg
          287132_A17106_dBB-.jpg
          287132_A17107_dBB-.jpg
          287132_A18486_dBB-.jpg
          287132_A18487_dBB-.jpg
          287132_A18488_dBB-.jpg
          287132_A18489__dBB-.jpg
          287132_A18490___dBB-.jpg
          287132_A18492__dBB-.jpg
          287132_A18493_dBB-.jpg
          287132_A18494_dBB-.jpg
          271142_A1547.jpg
          271142_A1553.jpg""".splitlines()
          out=pathlib.Path('official_i7_evidence');out.mkdir(exist_ok=True)
          records=[]
          for name in [x.strip() for x in names]:
              assert name.endswith('.jpg') and '/' not in name
              url=base+name
              record={'filename':name,'source_url':url,'retrieved':False}
              for attempt in range(2):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (ANRE legal I7 public source integrity audit; read-only)','Accept':'image/jpeg,image/png,*/*'})
                      with urllib.request.urlopen(req,timeout=14) as response:
                          payload=response.read(8_000_001); mime=response.headers.get('Content-Type','')
                          if len(payload)>8_000_000: raise ValueError('Image exceeds 8MB limit')
                          if not (payload.startswith(b'\xff\xd8\xff') or payload.startswith(b'\x89PNG\r\n\x1a\n')): raise ValueError('Not a JPEG/PNG, mime='+mime)
                          (out/name).write_bytes(payload)
                          record.update(retrieved=True,mime=mime,size=len(payload),sha256=hashlib.sha256(payload).hexdigest(),http_status=response.status)
                      break
                  except Exception as e:
                      record['error_type']=type(e).__name__;record['error_message']=str(e)[:180]
                      if attempt==0:time.sleep(1)
              records.append(record)
              print(('PASS ' if record['retrieved'] else 'FAIL ')+name)
          (out/'manifest.json').write_text(json.dumps({'source':'Portalul Legislativ Romanian government; binary candidate recovery ONLY; no normative/didactic QA approval','files':records},indent=2,ensure_ascii=False))
          print('Retrieved',sum(r['retrieved'] for r in records),'of',len(records))
          PY
      - name: Upload evidence (only user-controlled GitHub artifact, no commits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i7-figure-official-evidence-candidates
          path: official_i7_evidence/
          if-no-files-found: error
          retention-days: 7
