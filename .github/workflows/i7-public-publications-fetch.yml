name: I7 public scanned publications fetch (one-time)
on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/i7-public-publications-fetch.yml"]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download candidate PDF sources read-only and hash them
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          import hashlib,json,time
          candidates={
          "MO_802bis_I7_2011_sibotherm.pdf":"https://www.sibotherm.com/wp-content/uploads/Normativ-I7-2011-Monitor-Electrice.pdf",
          "MO_802bis_I7_2011_drimand.pdf":"https://www.drimand.ro/download/44%20NORMATIV%20I%207%20-%202011.pdf",
          "MO_512_I7_959_2023_curentulelectric.pdf":"https://curentulelectric.ro/wp-content/uploads/2023/11/Actualizari-2023-la-normativ-I7-2011.pdf"
          }
          out=Path('public_i7_pdf_candidates');out.mkdir(exist_ok=True)
          rows=[]
          for name,url in candidates.items():
              rec={'name':name,'url':url,'downloaded':False}
              try:
                  req=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'})
                  with urlopen(req,timeout=22) as resp:
                      data=resp.read(40_000_001)
                      if len(data)>40_000_000: raise ValueError('Too large')
                      if not data.startswith(b'%PDF-'):raise ValueError('Not PDF: '+str(resp.headers.get('Content-Type')))
                      (out/name).write_bytes(data)
                      rec.update(downloaded=True,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),http_status=resp.status)
              except Exception as e:rec.update(error_type=type(e).__name__,error=str(e)[:250])
              rows.append(rec);print(('PASS ' if rec['downloaded'] else 'FAIL ')+name)
          (out/'manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print('Download count:',sum(r['downloaded'] for r in rows))
          PY
      - name: Upload source candidates and provenance (no repository write)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i7-public-archive-pdf-candidates
          path: public_i7_pdf_candidates/
          retention-days: 7
