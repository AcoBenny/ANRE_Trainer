name: Academy shared JARVIS missing reviewer 093
on:
  push:
    branches: ['academy/free-api-router-gfr-20261120']
    paths: ['.github/workflows/academy-jarvis-synthetic-093-once.yml']
permissions:
  contents: read
concurrency:
  group: academy-jarvis-synthetic-093
  cancel-in-progress: false
jobs:
  synthetic:
    if: >-
      github.repository == 'AcoBenny/ANRE_Trainer' &&
      github.event.before == '531a917e86a9429d18edbd0d8f4fd693cdbf79fa' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline admission and syntax
        run: |
          python3 -m py_compile scripts/academy_jarvis_qa_retry_093.py
          env -u OPENROUTER_API_KEY python3 -B scripts/academy_jarvis_qa_retry_093.py /tmp/no-key.json
          python3 -c "import json; d=json.load(open('/tmp/no-key.json')); assert d['attempts']==0 and d['status']=='BLOCKED_NO_KEY_IN_ACADEMY'"
      - name: One fixed zero-price synthetic reviewer only
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 -B scripts/academy_jarvis_qa_retry_093.py _jarvis_qa/report.json
      - name: Publish synthetic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Academy-JARVIS-093-missing-reviewer
          path: _jarvis_qa/report.json
          retention-days: 3
          if-no-files-found: error
