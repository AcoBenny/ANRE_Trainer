name: ANRE Academy P0 targeted free-tier role recovery

on:
  push:
    branches:
      - 'academy/free-api-router-gfr-20261120'
    paths:
      - '.github/workflows/academy-p0-targeted-retest.yml'
      - 'docs/CKPT_275_P0_LINGUISTIC_RECOVERY_2026_11_20.md'
      - 'docs/CKPT_276_P0_MISSING_ROLES_RECOVERY_2026_11_20.md'
  pull_request:
    paths:
      - '.github/workflows/academy-p0-targeted-retest.yml'
      - 'scripts/academy_p0_priority_training.py'

permissions:
  contents: read

concurrency:
  group: anre-p0-one-role-retest
  cancel-in-progress: false

jobs:
  source-preserving-one-role:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline focused regression tests (zero provider calls)
        run: |
          python3 -m unittest discover -s tests -p 'test_academy_p0_priority_training.py' -v
          python3 -m unittest discover -s tests -p 'test_academy_agent_orchestrator.py' -v
      - name: Confirm immutable original twelve-question P0 queue
        run: |
          test "$(git hash-object docs/ACADEMY_P0_NEXT_12_EXACT_QABC_2026_11_20.json)" = "db189edd918f5f780bb0ea75192b391deb165723"
      - name: Only unresolved six ANRE specialist role slots (free APIs only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/academy/free-api-router-gfr-20261120' && contains(github.event.head_commit.message, '[p0-roles]')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
        run: |
          set +e
          bad=0
          # Original successful reviewer outputs are preserved from earlier runs.
          # Never re-run QABC-0065, which already passed linguistic role retry.
          for pair in \
            "QABC-0050 independent_skeptic" \
            "QABC-0050 linguistic_scope" \
            "QABC-0080 independent_skeptic" \
            "QABC-0091 linguistic_scope" \
            "QABC-0096 linguistic_scope" \
            "QABC-0025 linguistic_scope"; do
            set -- $pair
            unit="$1"
            role="$2"
            out="_p0_recovery_${unit}_${role}"
            python3 scripts/academy_p0_priority_training.py \
              --queue docs/ACADEMY_P0_NEXT_12_EXACT_QABC_2026_11_20.json \
              --mode live-free --confirm FREE_ONLY \
              --only-unit "$unit" --only-role "$role" --out "$out" || bad=$((bad + 1))
          done
          echo "Targeted specialist retries requiring later reconciliation or failed: $bad"
          test "$bad" -eq 0

      - name: Archive precisely targeted role traces, no learner approvals
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[p0-roles]')
        uses: actions/upload-artifact@v4
        with:
          name: academy-p0-six-only-role-retests
          path: _p0_recovery_*/
          retention-days: 7
          if-no-files-found: warn
